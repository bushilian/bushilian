name: Update nodes

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xray (for real proxy test)
        run: |
          curl -sL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip
          unzip -o -q /tmp/xray.zip -d /tmp/xray-bin xray
          chmod +x /tmp/xray-bin/xray
          /tmp/xray-bin/xray version | head -1

      - name: Fetch and test nodes
        run: python3 fetch_nodes.py --xray /tmp/xray-bin/xray

      - name: Commit and push if changed
        run: |
          git config user.name "bushilian"
          git config user.email "356933998+bushilian@users.noreply.github.com"
          git add sub .source-sha
          git diff --cached --quiet || git commit -m "Update nodes" && git push
